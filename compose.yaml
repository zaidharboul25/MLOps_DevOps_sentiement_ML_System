services:
  sentimentai:
    build: .
    ports:
      - "8000:8000"
    environment:
      SENTIMENTAI_DATABASE_PATH: /app/data/sentimentai.db
    volumes:
      - sentimentai-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
volumes:
  sentimentai-data:
